[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "edgm-second"
version = "0.1.0"
description = "Read-only P0 validation and AST foundation for EDGM research point two"
requires-python = ">=3.10"

[project.scripts]
edgm-second = "edgm_second.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
